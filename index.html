<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0f7;--card:#fff;--ink:#231a2e;--mute:#6d6277;--line:#ded5e6;--acc:#6b3fa0;--P:#b86a0a;--S:#0b7f7a;--M:#b83a63;--W:#2a6fb8;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121e;--card:#211a2b;--ink:#efe9f5;--mute:#a99db5;--line:#392f47;--acc:#b98ae6;--P:#e9a03a;--S:#3cc2bb;--M:#ef7a9f;--W:#6fb0f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121e;--card:#211a2b;--ink:#efe9f5;--mute:#a99db5;--line:#392f47;--acc:#b98ae6;--P:#e9a03a;--S:#3cc2bb;--M:#ef7a9f;--W:#6fb0f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 96px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.P{--c:var(--P)}.S{--c:var(--S)}.M{--c:var(--M)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.wk button{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.wk span{font-size:12px;color:var(--mute)}.wk b{font-size:13px;color:var(--c)}
.wk button.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.hero{border-left:5px solid var(--c);padding:2px 0 2px 14px;margin-bottom:18px}
.hero h1,.big{margin:0;font:800 clamp(44px,15vw,68px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .wo{margin:4px 0 0;font:600 21px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.hero .sh{margin:6px 0 0;color:var(--mute);font-size:14px}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card p{margin:6px 0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border:0}
.tl time{font:700 18px "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.shift b{color:var(--c)}
small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
em{font-style:normal;color:var(--M);display:block}
.row{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.row input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.row input:checked+span b{text-decoration:line-through;opacity:.55}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
button.b{cursor:pointer;background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:700}
button.b.g{background:var(--bg);color:var(--ink);border-color:var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--S))}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.fm .w2{grid-column:span 2}.fm .w4{grid-column:span 4}
.wb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.note{color:var(--mute);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{text-align:center;padding:10px 0;color:var(--mute);text-decoration:none;font-size:14px;border-radius:8px}
.tabs a.on{color:var(--acc);font-weight:700;background:var(--bg)}
</style></head>
<body><main id="app"></main><nav class="tabs" id="tabs"></nav>
<script>
const SH={
P:{n:"Pagi",h:["09:00","17:00"],wt:"19:00",pre:["17:00","Pre-workout snack"],post:["20:00","High-protein dinner"],c:"P"},
S:{n:"Siang",h:["14:00","22:00"],wt:"09:00",pre:["07:30","Pre-workout fruit or coffee"],post:["10:00","High-protein brunch"],c:"S"},
M11:{n:"Middle",h:["11:00","19:00"],wt:"20:30",pre:["17:30","Pre-workout snack, during shift"],post:["21:30","High-protein dinner"],c:"M"}};
const W={
lower_body_a:{t:"Lower body A",w:"Jumping Jacks, Hip Circles, Bodyweight Squats (5 mins)",core:"Backpack Hip Thrust (4x15), Bodyweight Bulgarian Split Squat (3x12/leg), Towel Floor Bridge Abduction (3x20)",cd:"Child’s Pose, Lying Figure-Four Stretch (5 mins)"},
lower_body_b:{t:"Lower body B",w:"Jumping Jacks, Bodyweight Glute Bridges (5 mins)",core:"Backpack Romanian Deadlift (3x15), Bodyweight Bulgarian Split Squat (3x12/leg), Towel Floor Bridge Abduction (3x20)",cd:"Kneeling Lunge Stretch, Lying Figure-Four Stretch (5 mins)"},
core_and_cardio:{t:"Core and cardio",w:"Light marching in place (5 mins)",core:"Static Plank (3x60 sec), Side Plank (3x45 sec/side)",cardio:"LISS Fast Walk (15-25 mins, adjust based on work fatigue)",cd:"Seated Butterfly Stretch (5 mins)"},
active_rest:{t:"Active rest",r:"No muscle training. Focus on work shift steps and recovery."},
total_rest:{t:"Total rest",r:"Total rest. Meal prep day for the upcoming week.",prep:1}};
const WK=[["Mon","P","lower_body_a"],["Tue","S","core_and_cardio"],["Wed","S","lower_body_b"],["Thu","M11","active_rest"],["Fri","S","lower_body_a"],["Sat","M11","core_and_cardio"],["Sun","P","total_rest"]];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const TG={k:[1750,1850],p:[110,140],c:[180,200],f:[45,55]};
const PAGES=[["today","Today"],["shift","Shift"],["meals","Meals"],["workout","Workout"],["water","Water"]];

const L=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
const V=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date(),today=(now.getDay()+6)%7;
const dt=i=>new Date(now.getFullYear(),now.getMonth(),now.getDate()-today+i);
const dk=i=>{const d=dt(i);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const fd=i=>dt(i).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const mins=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const fmt=n=>Math.round(n).toLocaleString("en-US");
let sel=today,D={},PL=L("sf:plan:"+dk(0),{}),WT=L("sf:wt",2300),LD=L("sf:ld",{});
const cur=i=>Object.assign({sh:WK[i][1],wr:WK[i][2]},PL[i]);
const saveD=()=>V("sf:day:"+dk(sel),D);
const chk=(id,label,sub)=>`<label class="row"><input type="checkbox" data-id="${id}" ${D.d&&D.d[id]?"checked":""}><span><b>${label}</b>${sub?`<small>${sub}</small>`:""}</span></label>`;
const pct=(v,hi)=>Math.min(100,v/hi*100);
const tot=()=>(D.m||[]).reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
const water=()=>(D.w||[]).reduce((a,e)=>a+e.ml,0);
const rng=a=>a[0]+"–"+a[1];

function hero(){
  const x=cur(sel),sh=SH[x.sh],w=W[x.wr];
  return `<header class="hero ${sh.c}"><h1>${w.r?"Rest":sh.wt}</h1><p class="wo">${w.t}</p>
  <p class="sh">${DAYS[sel]}, ${fd(sel)}${sel==today?" (today)":""}. ${sh.n} shift ${sh.h[0]}–${sh.h[1]}.</p></header>`;
}
const P={
today(){
  const x=cur(sel),sh=SH[x.sh],w=W[x.wr],train=!w.r,T=tot();
  const ev=[[sh.h[0],`<div class="shift ${sh.c}"><b>${sh.n} shift</b><small>${sh.h[0]}–${sh.h[1]}</small></div>`]];
  if(train){
    const gap=mins(sh.wt)-mins(sh.pre[0]);
    ev.push([sh.pre[0],chk("pre",sh.pre[1],"Clean carbs, e.g. banana or sweet potato"+(gap!==90?`<em>${gap} min before training; the rule says 90.</em>`:""))]);
    ev.push([sh.wt,chk("wo",w.t,"Workout")]);
    ev.push([sh.post[0],chk("post",sh.post[1],"Rice + chicken or fish + tempeh")]);
  }else if(w.prep)ev.push(["Any",chk("prep","Meal prep","For the upcoming week")]);
  ev.sort((a,b)=>a[0]<b[0]?-1:1);
  const st=D.s||0;
  return hero()+`<section class="card"><h2>Day plan</h2><ol class="tl">${ev.map(e=>`<li><time>${e[0]}</time>${e[1]}</li>`).join("")}</ol></section>
  <section class="card"><h2>Daily habits</h2>${chk("vac","Stomach vacuum","5 rounds × 30 seconds, in the morning")}
  <div class="rw" style="margin-top:8px"><label for="st">Steps</label><input id="st" type="number" inputmode="numeric" min="0" value="${st||""}" placeholder="0"><small>of 8,000</small></div>
  <div class="bar"><i id="stb" style="width:${pct(st,8000)}%"></i></div></section>
  <section class="card"><h2>Progress</h2>
  <a href="#meals" style="color:inherit"><b>${fmt(T.k)}</b> of ${rng(TG.k)} kcal</a><div class="bar"><i style="width:${pct(T.k,TG.k[1])}%"></i></div>
  <a href="#water" style="color:inherit"><b>${fmt(water())}</b> of ${fmt(WT)} ml water</a><div class="bar"><i style="--c:var(--W);width:${pct(water(),WT)}%"></i></div></section>`;
},
shift(){
  return `<h2 style="font-size:22px;margin-bottom:12px">Shifts this week</h2>`+WK.map((y,i)=>{
    const c=cur(i),s=SH[c.sh],w=W[c.wr];
    return `<section class="card ${s.c}" style="border-left:5px solid var(--c)"><div class="rw"><div><b>${DAYS[i]}</b><small>${fd(i)}${i==today?" (today)":""}</small></div>
    <select data-sh="${i}" aria-label="Shift for ${DAYS[i]}">${Object.keys(SH).map(k=>`<option value="${k}"${k==c.sh?" selected":""}>${k}: ${SH[k].n} ${SH[k].h[0]}–${SH[k].h[1]}</option>`).join("")}</select></div>
    <small>${w.r?w.t:"Train at "+s.wt+": "+w.t}</small></section>`}).join("")+
  `<button class="b g" data-act="reset">Reset week to default</button><p class="note">Training time and meal times follow the shift you pick. Change the routine for a day on the Workout page.</p>`;
},
meals(){
  const x=cur(sel),sh=SH[x.sh],T=tot(),ms=(D.m||[]).map((m,i)=>[m,i]).sort((a,b)=>a[0].t<b[0].t?-1:1);
  const mac=[["p","Protein"],["c","Carbs"],["f","Fats"]].map(a=>`<div><small>${a[1]}</small><b>${fmt(T[a[0]])} g</b><small>${rng(TG[a[0]])}</small><div class="bar"><i style="width:${pct(T[a[0]],TG[a[0]][1])}%"></i></div></div>`).join("");
  const lo=TG.p[0]*4+TG.c[0]*4+TG.f[0]*9,hi=TG.p[1]*4+TG.c[1]*4+TG.f[1]*9;
  return hero()+`<section class="card"><h2>Today’s totals</h2><b>${fmt(T.k)}</b> of ${rng(TG.k)} kcal<div class="bar"><i style="width:${pct(T.k,TG.k[1])}%"></i></div><div class="mac" style="margin-top:10px">${mac}</div>
  <p class="note">Macro ranges add up to ${fmt(lo)}–${fmt(hi)} kcal, so the calorie target only fits the upper part of them.</p></section>
  ${W[x.wr].r?"":`<section class="card"><h2>Timing for this shift</h2><p><b>${sh.pre[0]}</b> ${sh.pre[1]}<small>Clean carbs, 1.5 hours before training is the rule.</small></p><p><b>${sh.post[0]}</b> ${sh.post[1]}<small>Within 1 hour after training.</small></p></section>`}
  <section class="card"><h2>Log a meal</h2><div class="fm">
  <input class="w2" id="mn" placeholder="Meal name" aria-label="Meal name"><input class="w2" id="mt" type="time" value="${now.toTimeString().slice(0,5)}" aria-label="Time">
  <input id="mk" type="number" inputmode="decimal" placeholder="kcal" aria-label="kcal"><input id="mp" type="number" inputmode="decimal" placeholder="P g" aria-label="Protein g"><input id="mc" type="number" inputmode="decimal" placeholder="C g" aria-label="Carbs g"><input id="mf" type="number" inputmode="decimal" placeholder="F g" aria-label="Fats g">
  <button class="b w4" data-act="addmeal">Add meal</button></div></section>
  <section class="card"><h2>Logged meals</h2>${ms.length?ms.map(a=>`<div class="rw" style="padding:6px 0"><div><b>${a[0].t} ${esc(a[0].n||"Meal")}</b><small>${fmt(a[0].k)} kcal, P ${fmt(a[0].p)} / C ${fmt(a[0].c)} / F ${fmt(a[0].f)}</small></div><button class="b g" data-del="${a[1]}" aria-label="Delete meal">Delete</button></div>`).join(""):`<p class="note">Nothing logged yet. Add your first meal above.</p>`}</section>`;
},
workout(){
  const x=cur(sel),w=W[x.wr];
  let b;
  if(w.r)b=`<p>${w.r}</p>`;
  else b=`<p><b>Warm-up</b><small>${w.w}</small></p>`+w.core.split(", ").map((e,i)=>{
    const bp=/^Backpack/.test(e),ld=(D.ld&&D.ld[e]!=null)?D.ld[e]:(LD[e]||"");
    return chk("ex"+i,e)+(bp?`<div class="rw" style="margin:0 0 6px 32px"><small>Backpack load (kg)</small><input data-ld="${esc(e)}" type="number" inputmode="decimal" min="0" step="0.5" value="${ld}" style="width:90px"></div>`:"")}).join("")+(w.cardio?chk("cardio",w.cardio):"")+`<p><b>Cool-down</b><small>${w.cd}</small></p>`;
  return hero()+`<section class="card"><h2>Plan for ${DAYS[sel]}</h2><select data-wr="1" style="width:100%" aria-label="Workout routine">${Object.keys(W).map(k=>`<option value="${k}"${k==x.wr?" selected":""}>${W[k].t}</option>`).join("")}</select></section>
  <section class="card"><h2>${w.t}</h2>${b}</section>`;
},
water(){
  const t=water(),n=(D.w||[]).length;
  return hero()+`<section class="card" style="--c:var(--W)"><div class="big" style="color:var(--W)">${fmt(t)}<span style="font-size:20px"> ml</span></div>
  <div class="bar"><i style="width:${pct(t,WT)}%"></i></div><small>${t>=WT?"Target reached":fmt(WT-t)+" ml to go"} of ${fmt(WT)} ml. ${n} ${n==1?"entry":"entries"} logged.</small>
  <div class="wb">${[150,250,500].map(v=>`<button class="b" data-water="${v}">+${v} ml</button>`).join("")}<button class="b g" data-act="undo">Undo last</button></div>
  <div class="rw"><input id="wc" type="number" inputmode="numeric" min="0" placeholder="Custom ml" style="flex:1"><button class="b" data-act="wcustom">Add</button></div></section>
  <section class="card"><h2>Daily target</h2><div class="rw"><input id="wt" type="number" inputmode="numeric" min="500" step="100" value="${WT}" style="width:120px"><small>ml. Default is about 35 ml per kg for 66 kg. It is a rule of thumb, not part of your plan.</small></div></section>`;
}};

function render(){
  let p=(location.hash||"#today").slice(1);if(!P[p])p="today";
  D=L("sf:day:"+dk(sel),{});
  const strip=p=="shift"?"":`<nav class="wk" aria-label="Day">${WK.map((y,i)=>{const s=SH[cur(i).sh];return `<button data-day="${i}" class="${s.c}${i==sel?" on":""}" aria-pressed="${i==sel}"><span>${y[0]}</span><b>${cur(i).sh}</b></button>`}).join("")}</nav>`;
  $app.innerHTML=strip+P[p]();
  $tabs.innerHTML=PAGES.map(a=>`<a href="#${a[0]}"${a[0]==p?' class="on" aria-current="page"':""}>${a[1]}</a>`).join("");
  scrollTo(0,0);
}
const $app=document.getElementById("app"),$tabs=document.getElementById("tabs");
const num=id=>+document.getElementById(id).value||0;
const addW=ml=>{if(ml>0){(D.w=D.w||[]).push({t:new Date().toTimeString().slice(0,5),ml});saveD();render()}};
document.addEventListener("change",e=>{const t=e.target,s=t.dataset;
  if(s.id){D.d=D.d||{};D.d[s.id]=t.checked;saveD()}
  else if(s.sh){PL[s.sh]=Object.assign(cur(+s.sh),{sh:t.value});V("sf:plan:"+dk(0),PL);render()}
  else if(s.wr){PL[sel]=Object.assign(cur(sel),{wr:t.value});V("sf:plan:"+dk(0),PL);render()}
  else if(s.ld!==undefined){D.ld=D.ld||{};D.ld[s.ld]=LD[s.ld]=t.value;saveD();V("sf:ld",LD)}
  else if(t.id==="wt"){WT=Math.max(500,+t.value||2300);V("sf:wt",WT);render()}});
document.addEventListener("input",e=>{if(e.target.id==="st"){D.s=+e.target.value||0;saveD();document.getElementById("stb").style.width=pct(D.s,8000)+"%"}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const s=b.dataset;
  if(s.day){sel=+s.day;render()}
  else if(s.water)addW(+s.water);
  else if(s.del!==undefined){D.m.splice(+s.del,1);saveD();render()}
  else if(s.act==="undo"){(D.w||[]).pop();saveD();render()}
  else if(s.act==="wcustom")addW(num("wc"));
  else if(s.act==="reset"){PL={};V("sf:plan:"+dk(0),PL);render()}
  else if(s.act==="addmeal"){const n=document.getElementById("mn").value.trim(),k=num("mk");
    if(!n&&!k)return;(D.m=D.m||[]).push({t:document.getElementById("mt").value||"00:00",n,k,p:num("mp"),c:num("mc"),f:num("mf")});saveD();render()}});
addEventListener("hashchange",render);
render();
</script></body></html>
